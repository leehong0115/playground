<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { --bg: #0E0D0B; --fg: #EDE8DD; --muted: #8F897C; --line: #2A2823; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding-block: 72px 56px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 40px; line-height: 1.55; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li a { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
  li a:hover span:first-child { text-decoration: underline; text-underline-offset: 4px; }
  li a:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .date { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .empty { padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Playground</h1>
  <p>Small visual toys and experiments. Open one and play.</p>
  <ul>
    <!-- Newest first. One line per toy: <li><a href="folder/"><span>Name</span><span class="date">2026-10-20</span></a></li> -->
    <li class="empty">First toy coming soon.</li>
  </ul>
</main>
</body>
</html>
